name: Populate arXiv release

on:
  push:
    branches:
      - main
    paths:
      - .bootstrap-arxiv
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: populate-arxiv-release
  cancel-in-progress: false

jobs:
  populate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and organise arXiv v2
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ghostscript poppler-utils

          workdir="$(mktemp -d)"
          mkdir -p "$workdir/source"

          curl --fail --location --retry 5 --retry-all-errors \
            --user-agent "composite-hypothesis-testing repository bootstrap" \
            --output "$workdir/source.tar" \
            "https://arxiv.org/src/2608.28068v2"
          file "$workdir/source.tar"
          tar -xf "$workdir/source.tar" -C "$workdir/source"
          find "$workdir/source" -type f -printf '%P\n' | sort

          mapfile -t tex_files < <(find "$workdir/source" -type f -iname '*.tex' | sort -V)
          mapfile -t bib_files < <(find "$workdir/source" -type f -iname '*.bib' | sort -V)
          mapfile -t eps_files < <(find "$workdir/source" -type f -iname '*.eps' | sort -V)
          test "${#tex_files[@]}" -ge 1
          test "${#bib_files[@]}" -ge 1
          test "${#eps_files[@]}" -ge 5

          main_tex="${tex_files[0]}"
          for candidate in "${tex_files[@]}"; do
            if [[ "$(basename "$candidate")" =~ ^[Mm]anuscript.*\.tex$ ]]; then
              main_tex="$candidate"
              break
            fi
          done

          bibliography="${bib_files[0]}"
          for candidate in "${bib_files[@]}"; do
            if [[ "$(basename "$candidate")" == 'my.bib' ]]; then
              bibliography="$candidate"
              break
            fi
          done

          mkdir -p paper assets
          find paper -maxdepth 1 -type f ! -name 'README.md' -delete

          cp "$main_tex" paper/manuscript.tex
          cp "$bibliography" paper/my.bib
          for index in 1 2 3 4 5; do
            cp "${eps_files[$((index - 1))]}" "paper/Figure_${index}.eps"
          done

          curl --fail --location --retry 5 --retry-all-errors \
            --user-agent "composite-hypothesis-testing repository bootstrap" \
            --output paper/Manuscript.pdf \
            "https://arxiv.org/pdf/2608.28068v2"

          pages="$(pdfinfo paper/Manuscript.pdf | awk '/^Pages:/ {print $2}')"
          test "$pages" = "34"

          for index in 1 2; do
            gs -q -dSAFER -dBATCH -dNOPAUSE -dEPSCrop \
              -sDEVICE=pngalpha -r180 \
              -sOutputFile="assets/figure_${index}.png" \
              "paper/Figure_${index}.eps"
          done

          rm -f .bootstrap-arxiv

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Populate arXiv v2 source and figures [skip ci]"
          git push origin HEAD:main
