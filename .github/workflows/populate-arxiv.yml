name: Populate arXiv release

on:
  push:
    branches:
      - main
    paths:
      - .bootstrap-arxiv
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: populate-arxiv-release
  cancel-in-progress: false

jobs:
  populate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and organise arXiv v2
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ghostscript poppler-utils

          workdir="$(mktemp -d)"
          mkdir -p "$workdir/source"

          curl --fail --location --retry 5 --retry-all-errors \
            --user-agent "composite-hypothesis-testing repository bootstrap" \
            --output "$workdir/source.tar" \
            "https://export.arxiv.org/e-print/2608.28068v2"
          tar -xf "$workdir/source.tar" -C "$workdir/source"

          main_tex="$(find "$workdir/source" -type f -iname 'manuscript.tex' -print -quit)"
          bibliography="$(find "$workdir/source" -type f -iname 'my.bib' -print -quit)"
          test -n "$main_tex"
          test -n "$bibliography"

          mkdir -p paper assets
          find paper -maxdepth 1 -type f ! -name 'README.md' -delete

          cp "$main_tex" paper/manuscript.tex
          cp "$bibliography" paper/my.bib

          for index in 1 2 3 4 5; do
            figure="$(find "$workdir/source" -type f -iname "Figure_${index}.eps" -print -quit)"
            test -n "$figure"
            cp "$figure" "paper/Figure_${index}.eps"
          done

          curl --fail --location --retry 5 --retry-all-errors \
            --user-agent "composite-hypothesis-testing repository bootstrap" \
            --output paper/Manuscript.pdf \
            "https://arxiv.org/pdf/2608.28068v2"

          pages="$(pdfinfo paper/Manuscript.pdf | awk '/^Pages:/ {print $2}')"
          test "$pages" = "34"

          for index in 1 2; do
            gs -q -dSAFER -dBATCH -dNOPAUSE -dEPSCrop \
              -sDEVICE=pngalpha -r180 \
              -sOutputFile="assets/figure_${index}.png" \
              "paper/Figure_${index}.eps"
          done

          rm -f .bootstrap-arxiv

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Populate arXiv v2 source and figures [skip ci]"
          git push origin HEAD:main
