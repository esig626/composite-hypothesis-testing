name: Replot nonordered Bruno with Fano converse

on:
  push:
    branches:
      - codex/add-fano-converse
    paths:
      - numerics/scripts/replot_nonordered_bruno_2x2.py
      - .github/workflows/replot-nonordered-bruno-fano.yml

permissions:
  contents: write

jobs:
  replot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/add-fano-converse

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install plotting dependency
        run: python -m pip install --disable-pip-version-check matplotlib

      - name: Replot from saved CSV and compute Fano converse
        run: python numerics/scripts/replot_nonordered_bruno_2x2.py

      - name: Commit generated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add numerics/figures/nonordered_bruno_2x2.eps numerics/figures/nonordered_bruno_2x2.png numerics/data/nonordered_bruno_fano_converse.csv
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate figure with precise converse labels"
            git push
          fi
