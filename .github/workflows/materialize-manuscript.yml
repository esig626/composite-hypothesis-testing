name: Materialize manuscript

on:
  push:
    branches: [main]
    paths:
      - 'manuscript/Manuscript.tex.zlib.b64.part*'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and verify Manuscript.tex
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, zlib
          parts = sorted(Path('manuscript').glob('Manuscript.tex.zlib.b64.part*'))
          if len(parts) != 5:
              raise RuntimeError(f'Expected 5 payload parts, found {len(parts)}')
          src = ''.join(p.read_text().strip() for p in parts)
          data = zlib.decompress(base64.b64decode(src))
          digest = hashlib.sha256(data).hexdigest()
          expected = '412b49def75eac8b0ce3e6e906508a04c3d9cbc03e11260ee2c833a93115b9ce'
          if digest != expected:
              raise RuntimeError(f'SHA256 mismatch: {digest}')
          Path('manuscript/Manuscript.tex').write_bytes(data)
          PY
      - name: Commit reconstructed manuscript
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manuscript/Manuscript.tex
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Add manuscript source'
          git push
