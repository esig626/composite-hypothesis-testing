name: Materialize manuscript

on:
  push:
    branches: [main]
    paths:
      - 'manuscript/Manuscript.tex.zlib.b64'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct Manuscript.tex
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, zlib
          src = Path('manuscript/Manuscript.tex.zlib.b64').read_text().strip()
          data = zlib.decompress(base64.b64decode(src))
          Path('manuscript/Manuscript.tex').write_bytes(data)
          PY
      - name: Commit reconstructed manuscript
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manuscript/Manuscript.tex
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Add manuscript source'
          git push
