name: Replot nonordered Bruno 2x2

on:
  push:
    branches:
      - codex/replot-nonordered-bruno-2x2
    paths:
      - numerics/scripts/replot_nonordered_bruno_2x2.py
      - numerics/data/nonordered_bruno_regimes.csv
      - .github/workflows/replot-nonordered-bruno-2x2.yml

permissions:
  contents: write

jobs:
  replot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/replot-nonordered-bruno-2x2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install plotting dependency
        run: python -m pip install --disable-pip-version-check matplotlib

      - name: Replot from saved CSV
        run: python numerics/scripts/replot_nonordered_bruno_2x2.py

      - name: Commit generated figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add numerics/figures/nonordered_bruno_2x2.eps numerics/figures/nonordered_bruno_2x2.png
          if ! git diff --cached --quiet; then
            git commit -m "Replot nonordered Bruno 2x2 figure"
            git push
          fi
