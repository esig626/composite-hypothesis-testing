name: Materialize Adrien manuscript

# Re-run marker after payload correction.
on:
  push:
    branches: [main]
    paths:
      - 'external/adrien_sdpi/.staging/Adrien_main.tex.zlib.b64.part3'
      - '.github/workflows/materialize-adrien.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and verify Adrien_main.tex
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, zlib, hashlib
          root = Path('external/adrien_sdpi/.staging')
          src = ''.join((root / f'Adrien_main.tex.zlib.b64.part{i}').read_text().strip() for i in (1,2,3))
          data = zlib.decompress(base64.b64decode(src))
          expected = 'ccfe0bd3a4ea01acf761848f5022c890d02057fbe6b40f6e2b98420af2decfd3'
          actual = hashlib.sha256(data).hexdigest()
          if actual != expected:
              raise SystemExit(f'SHA256 mismatch: {actual}')
          Path('external/adrien_sdpi/Adrien_main.tex').write_bytes(data)
          print(f'bytes={len(data)} sha256={actual}')
          PY
      - name: Commit reconstructed source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add external/adrien_sdpi/Adrien_main.tex
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Materialize full Adrien SDPI manuscript source'
          git push
